<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dar Makran Properties - Under Construction</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a1a, #b8860b);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            flex-direction: column;
        }

        .container {
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: fadeInScale 1.5s ease-out;
        }

        .brand {
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .contact {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
        }

        .contact a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contact i {
            font-size: 1.5rem;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">Dar Makran Properties</div>
        <h1>Under Construction</h1>
        <div class="contact">
            <a href="mailto:info@darmakranproperties.com">
                <i class="fas fa-envelope"></i> info@darmakranproperties.com
            </a>
            <a href="tel:+971557621019">
                <i class="fas fa-phone"></i> +971557621019
            </a>
        </div>
    </div>
</body>
</html>
